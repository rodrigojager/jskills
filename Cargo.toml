[package]
name = "jtasks"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Independent foreground task controller"
license = "MIT"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive", "env"] }
rusqlite = { version = "=0.38.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
