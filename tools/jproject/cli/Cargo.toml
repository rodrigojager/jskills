[package]
name = "jproject"
version = "0.1.3"
edition = "2021"
description = "Creates and lints AI workspace containers: a clean versioned product folder plus a work folder for everything agents produce."
license = "MIT"

[[bin]]
name = "jproject"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
dialoguer = { version = "0.11", default-features = false }
dirs = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
