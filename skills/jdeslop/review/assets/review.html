    for (const node of doc.querySelectorAll('a, area')) {
      for (const name of ['href', 'xlink:href']) {
        if (!node.getAttribute(name)?.startsWith('#')) node.removeAttribute(name);
      }
      node.removeAttribute('ping');
    }
    const policy = doc.createElement('meta');
    policy.httpEquiv = 'Content-Security-Policy';
    policy.content = previewPolicy;
    doc.head.prepend(policy);
    const highlight = doc.createElement('style');
    highlight.textContent = '[data-review-target]{outline:2px solid #008268 !important;outline-offset:2px !important}';
    doc.head.append(highlight);
    return doc.documentElement;
  }

  const baselines = new Map(data.surfaces.map(surface => [surface.id, baselineDocument(surface.baseline)]));

  function renderCandidate(surfaceId, at, view, {highlight = false, cumulative = true} = {}) {
    let root = baselines.get(surfaceId).cloneNode(true);
    const applied = new Set();
    const errors = [];
    if (view === 'original' || at < 0) return {root, applied, errors};
    const needed = new Set();
    function include(index) {
      if (needed.has(index)) return;
      needed.add(index);
      for (const id of data.fixes[index].requires) include(byId.get(id));
    }
    if (!cumulative) include(at);
    const through = view === 'before' ? at - 1 : at;
    for (let index = 0; index <= through; index++) {
      const fix = data.fixes[index];
      if (!cumulative && !needed.has(index)) continue;
      if (cumulative && ['skip', 'revise'].includes(decisions.get(fix.id)?.choice)) continue;
      const missing = fix.requires.filter(id => !applied.has(id));
      if (missing.length) {
        errors.push(fix.id + t(' requires ') + missing.join(', ') + '.');
        continue;
      }
      const changes = changesOn(fix, surfaceId);
      try {
        if (changes.length) {
          const candidate = root.cloneNode(true);
          applyChanges(candidate, changes, highlight && index === at);
          root = candidate;
        }
        applied.add(fix.id);
      } catch (error) {
        errors.push(fix.id + ' · ' + error.message);
      }
    }
    if (highlight && view === 'before') {
      for (const change of changesOn(data.fixes[at], surfaceId)) {
        try { selectTarget(root, change.target).setAttribute('data-review-target', ''); }
        catch { /* Some selectors exist only after an earlier operation in the same step. */ }
      }
    }
    return {root, applied, errors};
  }

  function stop(remember = false) {
    clearInterval(timer);
    timer = null;
    paused = remember;
    updatePlayback();
  }

  function updatePlayback() {
    const playing = timer !== null;
    $('play').querySelector('span').textContent = playing ? t('Pause sequence') : paused ? t('Resume sequence') : t('Play sequence');
    $('play').querySelector('use').setAttribute('href', playing ? '#icon-pause' : '#icon-play');
  }

  function select(index, view = 'after') {
    if (index !== current) $('change-popover').hidePopover();
    current = index;
    mode = current < 0 ? 'original' : view;
    render(true);
  }

  function selectCorrection(index) {
    const decision = decisions.get(data.fixes[index]?.id);
    if (['skip', 'revise'].includes(decision?.choice)) includeEarlier = false;
    select(index);
  }

  function captureScroll(frame) {
    const view = frame.contentWindow;
    const doc = frame.contentDocument;
    const containers = [...doc.querySelectorAll('[id]')]
      .filter(node => node !== doc.scrollingElement && (node.scrollTop || node.scrollLeft))
      .map(node => [node.id, node.scrollLeft, node.scrollTop]);
    return {x:view.scrollX, y:view.scrollY, containers};
  }

  function render(scroll = false) {
    const fix = data.fixes[current];
    const atOriginal = mode === 'original';
    const {root, applied, errors} = renderCandidate(surface.id, current, mode, {highlight:true, cumulative:includeEarlier});
    const nextDocument = '<!doctype html>' + root.outerHTML;
    if (nextDocument !== activeDocument || surface.id !== activeSurface) {
      if (activeSurface && !pendingFrame) {
        scrollPositions.set(activeSurface, captureScroll($('canvas')));
      }
      const revision = String(++frameRevision);
      pendingFrame = {surfaceId: surface.id, revision};
      root.setAttribute('data-review-frame', revision);
      $('canvas').srcdoc = '<!doctype html>' + root.outerHTML;
      activeDocument = nextDocument;
      activeSurface = surface.id;
    }
    $('effect-title').textContent = atOriginal ? 'Original' : fix.title;
    $('position').textContent = fix ? (current + 1) + ' / ' + data.fixes.length : t('Starting point');
    $('finding').textContent = atOriginal ? t('Baseline snapshot. Select a correction to see what changes.') : fix.finding;
    $('linked').textContent = atOriginal ? '' : fix.id + t(' · revision ') + fix.revision + ' · ' + fix.checkIds.join(', ') +
      (changesOn(fix, surface.id).length ? '' : t(' · No change on this page or state'));
    $('progress').textContent = decisions.size + ' / ' + data.fixes.length + t(' reviewed');
    $('message').textContent = errors.join(' ');
    $('message').hidden = !errors.length;
    $('previous').disabled = current < 0;
    $('next').disabled = current >= data.fixes.length - 1;
    $('play').disabled = !data.fixes.length;
    for (const choice of modes) {
      $(choice).setAttribute('aria-pressed', String(choice === mode));
      $(choice).disabled = choice !== 'original' && current < 0;
    }
    $('include-earlier').checked = includeEarlier;
    $('include-earlier').disabled = atOriginal;
    if (atOriginal) {
      $('view-caption').textContent = t('Original page. Select a fix to compare its before and after.');
    } else {
      const scope = includeEarlier ? t('Earlier eligible fixes are included.') :
        fix.requires.length ? t('Required fixes are included.') :
        mode === 'before' ? t('No fixes are shown.') : t('Only this fix is shown.');
      $('view-caption').textContent = mode === 'before'
        ? t`Before fix ${current + 1} of ${data.fixes.length}. ${scope}`
        : t`After fix ${current + 1} of ${data.fixes.length}. ${scope}`;
    }
    const reviewable = !atOriginal && mode !== 'before' && applied.has(fix.id) && changesOn(fix, surface.id).length;
    const fixId = fix?.id;
    const decision = decisions.get(fixId);
    const hasSourceEdit = sourceReady.has(fixId);
    const locked = !reviewable || !connected && hasSourceEdit || jobs.has(fixId) || submitting.has(fixId);
    for (const choice of ['keep', 'skip']) $(choice).setAttribute('aria-pressed', String(decision?.choice === choice));
    $('skip').disabled = locked;
    $('revise').disabled = locked;
    $('keep').disabled = locked || hasSourceEdit && Boolean(approvalIssue(fix));
    $('clear').hidden = !reviewable || !decision || jobs.has(fixId);
    $('clear').disabled = locked;
    $('keep').querySelector('span').textContent = hasSourceEdit || !fix && source ? t('Approve and queue') : t('Keep');
    if (locked && $('change-popover').matches(':popover-open')) $('change-popover').hidePopover();
    const job = fix && jobs.get(fix.id);
    $('source-status').hidden = !source || !fix || atOriginal;
    $('source-status').textContent = job ? t(jobNames[job.status]) + (job.detail ? ' · ' + job.detail : '') :
      fix && !sourceReady.has(fix.id) ? t('Preview only · No source edit prepared') :
      fix && submitting.has(fix.id) ? t('Submitting approval…') :
      fix && sourceReady.has(fix.id) ? approvalIssue(fix) : '';
    for (const [index, button] of [...$('queue').children].entries()) {
      const item = data.fixes[index];
      const decision = decisions.get(item.id);
      const execution = jobs.get(item.id);
      button.lastElementChild.textContent = item.id + ' · ' + (execution ? t(jobNames[execution.status]) :
        submitting.has(item.id) ? t('Submitting') : decision ? t(statusNames[decision.choice]) : t('Pending'));
      if (index === current) {
        button.setAttribute('aria-current', 'step');
        if (scroll) {
          const queue = $('queue');
          const bottom = button.offsetTop + button.offsetHeight;
          if (bottom > queue.scrollTop + queue.clientHeight) queue.scrollTop = bottom - queue.clientHeight;
          if (button.offsetTop < queue.scrollTop) queue.scrollTop = button.offsetTop;
        }
      } else button.removeAttribute('aria-current');
    }
    if (source) renderQueueSummary();
  }

  function sourcePreviewFailure(fix) {
    if (!previewFailures.has(fix.id)) {
      let failure = '';
      for (const id of Object.keys(fix.changesBySurface)) {
        const result = renderCandidate(id, byId.get(fix.id), 'after', {cumulative:false});
        if (result.applied.has(fix.id)) continue;
        failure = surfaces.get(id).title + ' · ' + result.errors.join(' ');
        break;
      }
      previewFailures.set(fix.id, failure);
    }
    return previewFailures.get(fix.id);
  }

  function approvalIssue(fix) {
    if (jobs.get(fix.id)?.status === 'applied') return '';
    if (['failed', 'interrupted', 'blocked'].includes(jobs.get(fix.id)?.status)) {
      return fix.id + t(' needs a new source revision.');
    }
    if (!sourceReady.has(fix.id)) return fix.id + t(' has no source edit prepared.');
    const failure = sourcePreviewFailure(fix);
    if (failure) return failure;
    for (const id of fix.requires) {
      if (['skip', 'revise'].includes(decisions.get(id)?.choice)) {
        return t('Prerequisite ') + id + t(' was skipped or returned for changes.');
      }
      const issue = approvalIssue(data.fixes[byId.get(id)]);
      if (issue) return issue;
    }
    return '';
  }

  function batchCandidates() {
    if (!connected) return [];
    return data.fixes.filter(fix => sourceReady.has(fix.id) && !jobs.has(fix.id) && !submitting.has(fix.id) &&
      !['skip', 'revise'].includes(decisions.get(fix.id)?.choice) && !approvalIssue(fix));
  }

  function renderQueueSummary() {
    const counts = {};
    for (const job of jobs.values()) counts[job.status] = (counts[job.status] ?? 0) + 1;
    const labels = Object.keys(jobNames).filter(status => counts[status])
      .map(status => counts[status] + ' ' + t(jobNames[status]).toLowerCase());
    if (submitting.size) labels.push(submitting.size + t(' submitting'));
    $('queue-summary').textContent = !connected ? t('Connecting to the source queue…') :
      labels.join(' · ') || t('Ready to apply approved changes to source.');
    const remaining = batchCandidates().length;
    $('queue-all').querySelector('span').textContent = remaining ? t('Approve and queue all (') + remaining + ')' : t('Approve and queue all');
    $('queue-all').disabled = !remaining;
  }

  function rememberJobs() {
    for (const job of jobs.values()) {
      decisions.set(job.id, {choice:'keep', note:job.note});
    }
  }

  async function queueRequest(entries) {
    const version = ++requestVersion;
    const headers = {'X-Review-Token':source.token};
    if (entries) headers['Content-Type'] = 'application/json';
    const response = await fetch('/api/queue', entries ?
      {method:'POST', headers, body:JSON.stringify(entries)} : {headers});
    if (response.status === 403 || response.status === 404) throw new Error(t('Reload to reconnect to the local review server.'));
    const result = await response.json();
    if (!response.ok) throw new Error(result.error ?? t('The queue request failed.'));
    if (version < latestResponse) return;
    latestResponse = version;
    const next = new Map(result.jobs.map(job => [job.id, job]));
    if (connected && JSON.stringify([...jobs]) === JSON.stringify([...next])) return;
    connected = true;
    jobs = next;
    rememberJobs();
    persist();
    render();
  }

  function submit(fixes) {
    if (!fixes.length) return;
    const entries = fixes.map(fix => ({id:fix.id, fingerprint:fix.fingerprint,
      note:(decisions.get(fix.id)?.note ?? '').trim()}));
    for (const fix of fixes) submitting.add(fix.id);
    render();
    commands = commands.then(async () => {
      try {
        await queueRequest(entries);
        $('notice').textContent = fixes.length === 1 ? t('Approval sent · ') + fixes[0].id :
          t('Approvals sent for ') + fixes.length + t(' corrections.');
      } catch (error) {
        $('notice').textContent = error.message;
      } finally {
        for (const fix of fixes) submitting.delete(fix.id);
        render();
      }
    });
  }

  function exported() {
    return {schema:1, reviewId:data.reviewId, decisions:data.fixes.flatMap(fix => {
      const decision = decisions.get(fix.id);
      return decision ? [{id:fix.id, revision:fix.revision, fingerprint:fix.fingerprint, ...decision}] : [];
    })};
  }

  function persist() {
    try { localStorage.setItem(storageKey, JSON.stringify(exported())); }
    catch { /* Export is available when browser storage is disabled. */ }
  }

  function restore(payload) {
    if (payload?.schema !== 1 || payload.reviewId !== data.reviewId || !Array.isArray(payload.decisions)) {
      throw new Error(t('This export belongs to a different review or has an invalid format.'));
    }
    let imported = 0;
    let ignored = 0;
    for (const entry of payload.decisions) {
      const fix = data.fixes[byId.get(entry?.id)];
      if (!fix || fix.revision !== entry.revision || fix.fingerprint !== entry.fingerprint ||
          !Object.hasOwn(statusNames, entry.choice) || typeof entry.note !== 'string' ||
          (entry.choice === 'revise' && !entry.note.trim())) {
        ignored++;
        continue;
      }
      decisions.set(fix.id, {choice:entry.choice, note:entry.note});
      imported++;
    }
    return {imported, ignored};
  }

  function save(choice, note) {
    const fix = data.fixes[current];
    if (!fix || $(choice).disabled) return;
    if (choice === 'keep' && sourceReady.has(fix.id)) {
      if (!approvalIssue(fix)) submit([fix]);
      return;
    }
    decisions.set(fix.id, {choice, note:note ?? decisions.get(fix.id)?.note ?? ''});
    persist();
    if (choice !== 'keep') includeEarlier = false;
    render();
    $('notice').textContent = statusNames[choice] + ' · ' + fix.id + t(' · revision ') + fix.revision;
  }

  function positionChangePopover() {
    const popover = $('change-popover');
    if (!popover.matches(':popover-open')) return;
    const anchor = $('revise').getBoundingClientRect();
    const margin = 12;
    const gap = 8;
    const below = anchor.bottom + gap;
    const above = anchor.top - popover.offsetHeight - gap;
    const top = below + popover.offsetHeight <= innerHeight - margin || above < margin ? below : above;
    popover.style.top = Math.max(margin, Math.min(top, innerHeight - popover.offsetHeight - margin)) + 'px';
    popover.style.left = Math.max(margin, Math.min(anchor.right - popover.offsetWidth, innerWidth - popover.offsetWidth - margin)) + 'px';
  }

  function closeChangePopover() {
    $('change-popover').hidePopover();
    $('revise').focus({preventScroll:true});
  }

  function start() {
    if (timer !== null) { stop(true); return; }
    if (!paused || current >= data.fixes.length - 1) select(-1);
    paused = false;
    includeEarlier = true;
    render();
    timer = setInterval(() => {
      if (current >= data.fixes.length - 1) { stop(); return; }
      select(current + 1);
      if (current === data.fixes.length - 1) stop();
    }, 1500);
    updatePlayback();
  }

  function openCoverage() {
    $('coverage-dialog').showModal();
  }

  function localizeContext() {
    $('title').textContent = data.title;
    document.title = data.title + t(' · jdeslop review');
    $('context').textContent = data.context + t(' · Visual snapshot');
  }

  function buildControls() {
    localizeContext();
    for (const item of data.surfaces) {
      const option = element('option', item.title);
      option.value = item.id;
      $('surface').append(option);
    }
    $('surface-label').hidden = data.surfaces.length === 1;
    $('source-actions').hidden = !source;
    for (const [index, fix] of data.fixes.entries()) {
      const button = element('button', '');
      button.append(element('strong', fix.title), element('span', '', 'item-meta'));
      button.onclick = () => {
        stop();
        if (!changesOn(fix, surface.id).length) changeSurface(Object.keys(fix.changesBySurface)[0]);
        selectCorrection(index);
      };
      $('queue').append(button);
    }
    changeSurface(surface.id);
  }

  function changeSurface(id) {
    $('change-popover').hidePopover();
    surface = surfaces.get(id);
    $('surface').value = id;
    $('live').hidden = !surface.liveUrl;
    if (surface.liveUrl) $('live').href = surface.liveUrl;
    else $('live').removeAttribute('href');
    renderCoverage();
  }

  function renderCoverage() {
    $('coverage').querySelector('span').textContent = t('Coverage · ') + surface.checks.length;
    $('coverage-title').textContent = t('Audit coverage · ') + surface.title;
    $('checks').replaceChildren();
    for (const check of surface.checks) {
      const row = element('article', '', 'check');
      row.append(element('h3', check.id + ' · ' + t(check.status)), element('p', check.evidence || t('Awaiting evidence.')));
      if (check.gap) row.append(element('p', t('Evidence gap: ') + check.gap));
      const actions = element('div', '', 'group');
      for (const [index, fix] of data.fixes.entries()) {
        if (!changesOn(fix, surface.id).length || !fix.checkIds.includes(check.id) || check.status !== 'finding') continue;
        const button = element('button', fix.title);
        button.onclick = () => {
          $('coverage-dialog').close();
          stop();
          selectCorrection(index);
          $('queue').children[index].focus({preventScroll:true});
        };
        actions.append(button);
      }
      if (check.status === 'finding' && !actions.children.length) actions.textContent = t('No visual correction staged.');
      row.append(actions);
      $('checks').append(row);
    }
  }

  $('canvas').addEventListener('load', () => {
    const frame = $('canvas');
    if (!pendingFrame || frame.contentDocument?.documentElement?.dataset.reviewFrame !== pendingFrame.revision) return;
    const saved = scrollPositions.get(pendingFrame.surfaceId);
    if (saved) {
      frame.contentWindow.scrollTo({left:saved.x, top:saved.y, behavior:'instant'});
      for (const [id, left, top] of saved.containers) {
        frame.contentDocument.getElementById(id)?.scrollTo({left, top, behavior:'instant'});
      }
    }
    pendingFrame = null;
  });
  connectPreferences(() => {
    $('notice').textContent = '';
    previewFailures.clear();
    updatePlayback();
    localizeContext();
    renderCoverage();
    render();
  });
  buildControls();
  try { restore(JSON.parse(localStorage.getItem(storageKey))); }
  catch { /* A first-time review has no saved choices. */ }
  render();
  $('previous').onclick = () => { stop(); selectCorrection(current - 1); };
  $('next').onclick = () => { stop(); selectCorrection(current + 1); };
  $('play').onclick = start;
  $('original').onclick = () => { stop(); mode = 'original'; render(); };
  for (const view of ['before', 'after']) $(view).onclick = () => { stop(paused); select(current, view); };
  $('include-earlier').onchange = () => {
    stop(paused);
    includeEarlier = $('include-earlier').checked;
    render();
  };
  $('surface').onchange = () => { changeSurface($('surface').value); render(); };
  $('width').onchange = () => {
    const value = $('width').value;
    $('canvas').style.width = value === 'fit' ? '100%' : value + 'px';
  };
  $('coverage').onclick = openCoverage;
  if (source) {
    const sync = () => queueRequest().catch(error => { $('notice').textContent = error.message; });
    sync();
    setInterval(sync, 900);
    $('queue-all').onclick = () => { stop(); submit(batchCandidates()); };
  }
  function updateSendRequest() {
    $('send-change').disabled = !$('note').value.trim();
  }
  $('note').oninput = updateSendRequest;
  for (const choice of ['keep', 'skip']) $(choice).onclick = () => { stop(); save(choice); };
  $('revise').onclick = () => {
    if ($('change-popover').matches(':popover-open')) return;
    stop();
    $('note').value = decisions.get(data.fixes[current].id)?.note ?? '';
    updateSendRequest();
  };
  $('change-popover').addEventListener('toggle', (event) => {
    const open = event.newState === 'open';
    $('revise').setAttribute('aria-expanded', String(open));
    if (open) {
      positionChangePopover();
      $('note').focus({preventScroll:true});
    }
  });
  window.addEventListener('resize', positionChangePopover);
  window.addEventListener('scroll', positionChangePopover, {passive:true});
  $('cancel-change').onclick = closeChangePopover;
  $('change-form').onsubmit = (event) => {
    event.preventDefault();
    const note = $('note').value.trim();
    if (!note || $('revise').disabled) return;
    save('revise', note);
    closeChangePopover();
  };
  $('clear').onclick = () => {
    const fix = data.fixes[current];
    decisions.delete(fix.id);
    persist();
    render();
    $('notice').textContent = t('Decision cleared · ') + fix.id;
  };
  $('export').onclick = () => {
    const blob = new Blob([JSON.stringify(exported(), null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = element('a', '');
    link.href = url;
    link.download = data.reviewId + '-decisions.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  $('import').onclick = () => $('import-file').click();
  $('import-file').onchange = async () => {
    const [file] = $('import-file').files;
    $('import-file').value = '';
    if (!file) return;
    try {
      const {imported, ignored} = restore(JSON.parse(await file.text()));
      stop();
      rememberJobs();
      persist();
      render();
      $('notice').textContent = t`Imported ${imported} decisions. Ignored ${ignored} stale or invalid decisions.`;
    } catch (error) { $('notice').textContent = error.message; }
  };
</script>
</html>
